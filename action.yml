name: agentgate
description: Regression-test an AI agent - compare candidate traces against a baseline and gate the PR.
author: Sumit Biranje
branding:
  icon: shield
  color: green

inputs:
  config:
    description: Path to the suite file (agentgate.yaml).
    required: true
  candidate:
    description: Candidate trace file(s) or directory (space-separated for several).
    required: true
  baseline:
    description: Baseline trace file(s) or directory. Leave empty to run `agentgate check` (absolute gates only).
    required: false
    default: ""
  report-dir:
    description: Where to write report.md / report.json / report.html.
    required: false
    default: agentgate-report
  formats:
    description: Comma-separated report formats.
    required: false
    default: md,json,html
  judge-provider:
    description: Override judge.provider (replay | anthropic | scripted). For anthropic, set ANTHROPIC_API_KEY in env.
    required: false
    default: ""
  fail-on-gate:
    description: Fail the step when a gate fails (exit code 1). Set to "false" to only report.
    required: false
    default: "true"
  comment-on-pr:
    description: Post (or update) the Markdown report as a PR comment. Needs `pull-requests write` permission.
    required: false
    default: "false"
  github-token:
    description: Token used for the PR comment.
    required: false
    default: ${{ github.token }}
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  install:
    description: pip requirement to install agentgate from. Defaults to this action's own source.
    required: false
    default: ""

outputs:
  exit-code:
    description: 0 gates passed, 1 a gate failed, 2 usage/config error, 3 judge error.
    value: ${{ steps.run.outputs.exit-code }}
  passed:
    description: "true when every gate passed."
    value: ${{ steps.run.outputs.passed }}
  report-dir:
    description: Directory holding the reports.
    value: ${{ inputs.report-dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agentgate
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --quiet --disable-pip-version-check "${INSTALL:-$ACTION_PATH}"
        if [ "${{ inputs.judge-provider }}" = "anthropic" ]; then
          python -m pip install --quiet --disable-pip-version-check anthropic
        fi

    - name: Run agentgate
      id: run
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        REPORT_DIR: ${{ inputs.report-dir }}
        FORMATS: ${{ inputs.formats }}
        JUDGE: ${{ inputs.judge-provider }}
      run: |
        args=(-c "$CONFIG" -o "$REPORT_DIR" -f "$FORMATS")
        [ -n "$JUDGE" ] && args+=(--judge-provider "$JUDGE")
        for p in $CANDIDATE; do args+=(-t "$p"); done
        if [ -n "$BASELINE" ]; then
          for p in $BASELINE; do args+=(-b "$p"); done
          cmd=compare
        else
          cmd=check
        fi
        set +e
        agentgate "$cmd" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = "0" ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && hashFiles(format('{0}/report.md', inputs.report-dir)) != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ inputs.report-dir }}/report.md
      run: |
        gh pr comment "$PR" --edit-last --body-file "$REPORT" 2>/dev/null \
          || gh pr comment "$PR" --body-file "$REPORT"

    - name: Apply gate result
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
        FAIL_ON_GATE: ${{ inputs.fail-on-gate }}
      run: |
        if [ "$CODE" = "1" ] && [ "$FAIL_ON_GATE" != "true" ]; then
          echo "::warning::agentgate gates failed (fail-on-gate is false)"; exit 0
        fi
        exit "$CODE"
